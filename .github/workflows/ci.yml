name: Frontend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Build frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api
          NEXT_PUBLIC_ENV: test
          NEXT_PUBLIC_KAKAO_CLIENT_ID: test-client-id
          NEXT_PUBLIC_KAKAO_REDIRECT_URI: http://localhost:3005/login/kakao
          NEXT_PUBLIC_KAKAO_MAP_KEY: test-map-key
          NEXT_PUBLIC_KAKAO_REST_API_KEY: test-rest-key
          NEXT_PUBLIC_GOOGLE_ID: test-google-id
          NEXT_PUBLIC_GOOGLE_REDIRECT_URI: http://localhost:3005/login/google
